services:
  db:
    image: pgvector/pgvector:pg16
    container_name: visual-search-db
    environment:
      - POSTGRES_DB=visual_search
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      # Host port 5433 (not 5432) so this doesn't collide with a
      # Postgres instance you might already have running locally.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d visual_search"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: visual-search-adminer
    environment:
      # Pre-fills the login form's "System"/"Server" fields.
      - ADMINER_DEFAULT_SERVER=db
    ports:
      # Dev-only DB dashboard -- not meant to be exposed beyond localhost.
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: visual-search-redis
    ports:
      # Host port 6380 (not 6379) so this doesn't collide with a Redis
      # instance you might already have running locally.
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No volume: rate-limit counters are short-lived and fine to lose
    # on restart -- this isn't a cache/queue that needs durability.

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: visual-search-rabbitmq
    # Dedicated broker for the bulk-import queue (app/queue.py), kept
    # deliberately separate from `redis` above -- see app/queue.py's
    # docstring for why. Unlike `redis`, this one IS given a volume:
    # a queued-but-not-yet-imported product is real work, not a
    # disposable counter, so it should survive a container restart.
    ports:
      # Host port 5673 (not 5672) so this doesn't collide with a
      # RabbitMQ instance you might already have running locally.
      - "5673:5672"
      # Management UI (http://localhost:15673, guest/guest) -- handy
      # for watching the `product_import` queue's depth while testing.
      - "15673:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Explicit tag (rather than letting compose auto-name it) so `worker`
    # below can declare the same image and the two never drift -- both
    # run identical code, just with a different `command:`.
    image: visual-search-poc-backend
    container_name: visual-search-backend
    ports:
      - "8010:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/visual_search
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      # Dev-only default -- override this before exposing the API beyond
      # your own machine (main.py logs a warning at startup if you don't).
      # Uncomment to override the per-endpoint rate limits (defaults set
      # in app/config.py: SEARCH_RATE_LIMIT=20/minute, PRODUCTS_RATE_LIMIT=60/minute,
      # CREATE_PRODUCT_RATE_LIMIT=10/minute, BULK_IMPORT_RATE_LIMIT=5/minute).
      # - SEARCH_RATE_LIMIT=20/minute
      # - PRODUCTS_RATE_LIMIT=60/minute
      # DEBUG adds per-step timing logs (CLIP embed, attribute
      # classification, the pgvector query) for each request -- see
      # docs/architecture.md's "Logging and request correlation" section.
      # - LOG_LEVEL=DEBUG
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      # Live-reload app/script code without rebuilding the image.
      - ./backend/app:/app/backend/app
      - ./backend/scripts:/app/backend/scripts
      # Catalog stays on the host, so editing products or rebuilding
      # embeddings doesn't require a rebuild. The index itself now
      # lives in the `db` service (see backend/app/db.py), not here.
      - ./catalog:/app/catalog
      - ./backend/data:/app/backend/data
      # Persist the downloaded CLIP weights across container restarts
      # and rebuilds (first run downloads ~600MB from Hugging Face).
      - huggingface_cache:/root/.cache/huggingface
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: visual-search-poc-backend
    container_name: visual-search-worker
    # Consumes app.config.PRODUCT_IMPORT_QUEUE_NAME (POST /products/import's
    # jobs) from RabbitMQ. No ports -- this isn't an HTTP service, and
    # no REDIS_URL either -- rate limiting is an API-process concern
    # only, this worker never touches Redis. Loads its own CLIP model +
    # DB pool independently of `backend` (see app/jobs.py): a separate
    # process, so it can't reuse the API process's copies.
    # Restart automatically if a message-processing crash propagates
    # out of scripts/run_worker.py (see that script's docstring) --
    # otherwise the container would just exit and nothing more would
    # ever get consumed from the queue.
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/visual_search
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/backend/app
      - ./backend/scripts:/app/backend/scripts
      # Writes catalog/<sku>/ for every product it imports -- same as
      # `backend`'s POST /products, just triggered from a queued job
      # instead of an inline request.
      - ./catalog:/app/catalog
      - ./backend/data:/app/backend/data
      - huggingface_cache:/root/.cache/huggingface
    command: python scripts/run_worker.py

volumes:
  huggingface_cache:
  pgdata:
  rabbitmq_data:
