services:
  db:
    image: pgvector/pgvector:pg16
    container_name: visual-search-db
    environment:
      - POSTGRES_DB=visual_search
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      # Host port 5433 (not 5432) so this doesn't collide with a
      # Postgres instance you might already have running locally.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d visual_search"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: visual-search-adminer
    environment:
      # Pre-fills the login form's "System"/"Server" fields.
      - ADMINER_DEFAULT_SERVER=db
    ports:
      # Dev-only DB dashboard -- not meant to be exposed beyond localhost.
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: visual-search-redis
    ports:
      # Host port 6380 (not 6379) so this doesn't collide with a Redis
      # instance you might already have running locally.
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No volume: rate-limit counters are short-lived and fine to lose
    # on restart -- this isn't a cache/queue that needs durability.

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: visual-search-backend
    ports:
      - "8010:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/visual_search
      - REDIS_URL=redis://redis:6379/0
      # Dev-only default -- override this before exposing the API beyond
      # your own machine (main.py logs a warning at startup if you don't).
      - API_KEY=dev-api-key-change-me
      # Uncomment to override the per-endpoint rate limits (defaults set
      # in app/config.py: SEARCH_RATE_LIMIT=20/minute, PRODUCTS_RATE_LIMIT=60/minute).
      # - SEARCH_RATE_LIMIT=20/minute
      # - PRODUCTS_RATE_LIMIT=60/minute
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Live-reload app/script code without rebuilding the image.
      - ./backend/app:/app/backend/app
      - ./backend/scripts:/app/backend/scripts
      # Catalog stays on the host, so editing products or rebuilding
      # embeddings doesn't require a rebuild. The index itself now
      # lives in the `db` service (see backend/app/db.py), not here.
      - ./catalog:/app/catalog
      - ./backend/data:/app/backend/data
      # Persist the downloaded CLIP weights across container restarts
      # and rebuilds (first run downloads ~600MB from Hugging Face).
      - huggingface_cache:/root/.cache/huggingface
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  huggingface_cache:
  pgdata:
